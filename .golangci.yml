version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - prealloc
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    misspell:
      locale: US
      ignore-rules:
        - organisation
        - catalogue
    revive:
      rules:
        - name: exported
          arguments: [disableStutteringCheck]
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [unparam]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/downmonitor/cli

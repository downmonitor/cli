name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The command you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The output of the command with `--verbose`. Remove anything sensitive.
      render: console
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `downmonitor --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows, Docker]
    validations:
      required: true
